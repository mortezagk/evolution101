# Dependabot version updates for Python dependencies (requirements.txt).
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Minor and patch updates are grouped into a single PR and auto-merged once the
# build passes (see .github/workflows/dependabot-automerge.yml). Major updates
# are not grouped, so each arrives as its own PR for manual review.

version: 2
updates:
  - package-ecosystem: "pip" # Check for Python package updates
    directory: "/" # Location of requirements.txt
    schedule:
      interval: "monthly"
    ignore:
      # pelican 4.12.0 requires pygments<2.20.0. Remove once pelican allows it.
      - dependency-name: "pygments"
        versions: [">=2.20"]
    groups:
      pip-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
