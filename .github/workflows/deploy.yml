name: Build and deploy site

on:
  push:
    branches:
      - master
  pull_request:
  # Monthly redeploy: merges made by the Dependabot auto-merge workflow use
  # GITHUB_TOKEN, which does not trigger the push event above.
  schedule:
    - cron: '0 6 3 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build site with Pelican
        run: |
          rm -rf _build
          pelican content -s pelicanconf.py --fatal warnings

      # Fails the build (and so blocks the deploy) if an internal link points
      # at a missing file or an image linked from evolution.berkeley.edu
      # doesn't load.
      - name: Check links and images
        run: python scripts/check_links.py _build

      - name: Upload site artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    concurrency:
      group: "pages"
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
