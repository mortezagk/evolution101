{% extends "base.html" %}
{% block title %}{{ page.title }} | {{ SITENAME }}{% endblock %}
{% block content %}
<section id="content" class="body">
        <h1 class="entry-title">{{ page.title }}</h1>
        {% if page.source %}
        <a class="source-link" href="{{ page.source }}" rel="noopener" target="_blank" title="{{ page.source_title or page.source }}">متن اصلی ⎋</a>
        {% endif %}
        {% if PDF_PROCESSOR %}
                <a href="{{ SITEURL }}/pdf/{{ page.slug }}.pdf">
                        get the pdf
                </a>
        {% endif %}
        {{ page.content }}
</section>
{% endblock %}
