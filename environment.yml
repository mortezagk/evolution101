# Conda environment for local development.
# Package pins live only in requirements.txt (kept up to date by Dependabot);
# this file just provides Python and installs requirements.txt with pip.
# Keep the Python version in sync with .python-version.
#
#   conda env create -f environment.yml    # first time
#   conda env update -f environment.yml    # after requirements.txt changes
name: evolution101
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - -r requirements.txt
